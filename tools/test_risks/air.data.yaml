# MADE-UP TEST DATA: not a real risk. Shape of the risk assessment engine's risk files (one file per domain).
air.data.01:
  domain: Data
  category: Data ownership
  name: Nobody owns the data a critical process relies on
  likelihood_scoring:
    critical: ">.80 and RD70 in ad and RD71 in ad"
    high: ">.60 and RD70 in ad"
  likelihood_drivers: [RD70, RD71, RD12]
  impact_drivers: [RD02, RD50]
  impact_scoring:
    financial_impact:  { critical: null, high: "RD50 in ad", medium: "dc >= 1", low: null }
    client_impact:     { critical: null, high: "RD02 in ad", medium: "dc >= 1", low: null }
    regulatory_impact: { critical: "RD50 in ad and RD02 in ad", high: "RD50 in ad", medium: "dc >= 1", low: null }
  description: >
    Data that a critical process depends on has no named owner, so quality problems and access requests go unanswered.
  example: >
    A pricing table feeding client statements is edited by three teams and nobody signs off its accuracy.
  framework_mappings:
    iso_25010:
      - characteristic: Functional suitability
        sub_characteristic: Functional correctness
    nist_sp_800_30:
      - threat_event: Corrupt or deny access to critical data

air.data.02:
  domain: Data
  category: Data leakage
  name: Confidential data copied to an uncontrolled place
  likelihood_scoring:
    critical: ">.80 and RD01 in ad and RD72 in ad"
    high: ">.60 and RD72 in ad"
  likelihood_drivers: [RD72, RD01, RD36]
  impact_drivers: [RD02, RD50]
  impact_scoring:
    financial_impact:  { critical: null, high: "RD50 in ad", medium: "RD02 in ad", low: "dc >= 1" }
    client_impact:     { critical: "RD02 in ad and RD50 in ad", high: "RD02 in ad", medium: null, low: "dc >= 1" }
    regulatory_impact: { critical: "RD02 in ad and RD50 in ad", high: "RD02 in ad", medium: "dc >= 1", low: null }
  description: >
    Confidential data ends up somewhere the firm doesn't control or monitor, such as a personal drive or an unapproved tool.
  example: >
    A developer copies a production extract with client names into a test environment that has no access controls.
  framework_mappings:
    iso_25010:
      - characteristic: Security
        sub_characteristic: Confidentiality
    nist_sp_800_30:
      - threat_event: Obtain sensitive information through unauthorized copying
