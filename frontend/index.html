.cards .c1{display:flex;align-items:baseline;gap:12px}.cards .cn{font-size:16px;font-weight:650;color:var(--text)}.s-r .cn{color:var(--rt)}.s-a .cn{color:var(--at)}.s-g .cn{color:var(--gt)}.cards .cid{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.02em;align-self:flex-start}

.fam .lt td{padding:8px 8px;vertical-align:top}.fam .lt .res{font-size:16px}.fam .lt .cap{margin-top:2px}.lsec .ln{font-size:16px;margin:0}.lsec>summary{gap:2px 14px}

.xc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.xcard{margin:0;padding:10px 14px;border:1px solid var(--border);border-radius:6px;background:#fff}

function vGlossary(){
  return `<div class="method"><h1>Glossary</h1>
  <h2>Words you’ll see on the scorecard</h2><dl>
  <dt>Automatic Red rule</dt><dd>A rule that forces a metric to Red whatever its rate, such as an overdue critical secret. It caps the building block at ${CAP().automatic_red_block}.</dd>
  <dt>Behind peers</dt><dd>A metric well worse than the typical (median) value across families.</dd>
  <dt>Building block</dt><dd>One of the six things that earn clients’ trust, such as Security or Stability. Each is scored from its metrics.</dd>
  <dt>Cap</dt><dd>A limit on a score. A Red metric caps its building block at ${CAP().red_metric_block}; an automatic Red rule caps it at ${CAP().automatic_red_block}; a Red building block caps TRUST at ${CAP().red_block_trust}.</dd>
  <dt>Chronic Red</dt><dd>A metric that has been Red for three months in a row.</dd>
  <dt id="data-contract">Data contract</dt><dd>The written agreement between the team that sends a file and Tech Risk: which columns TRUST may read and which metrics the file may be used for. A file whose columns change is flagged until the provider confirms.</dd>
  <dt>Declining</dt><dd>A building block score that fell two months in a row.</dd>
  <dt>Firm tolerance</dt><dd>The firm TRUST score we have agreed to stay at or above. ${D.firm_tolerance ? `Set at ${D.firm_tolerance.value}.` : 'Not set yet: it appears once the Head of Tech Risk and the CTO agree a number.'}</dd>
  <dt>Flags</dt><dd>A flag is a note on the watch list; it never changes a colour or points. Behind peers needs at least 5 families that can be scored, and the gap used is shown on each metric’s card. Pass/fail and information-only metrics are never flagged, nor are metrics whose colours are already set by the median.</dd>
  <dt>Lock</dt><dd>Tech Risk locks a month on This month; the figures and the page are then frozen until someone reopens it with a reason.</dd>
  <dt>Missing data</dt><dd>A provider’s file did not arrive. Its metrics are left out and nothing is carried over from the month before.</dd>
  <dt>Newly Red</dt><dd>A metric that is Red this month and was not Red last month, or has no comparable last month.</dd>
  <dt>Not Tier 0/1</dt><dd>The family owns no Tier 0/1 (most critical) application, so a metric about them does not apply and is not scored.</dd>
  <dt>Overdue action</dt><dd>An action that is not done and is past its due date.</dd>
  <dt>Pass/fail metric</dt><dd>A metric scored on a rule rather than a rate, such as CyberArk vaulting: Green when every eligible item is done, Amber when any is not, Red when any Tier 0/1 item is not. It has no tolerance thresholds.</dd>
  <dt>Planned metric</dt><dd>A metric designed but with no data source yet. It counts in no score.</dd>
  <dt id="prevailing-median">Prevailing median</dt><dd>The middle value across all families for a metric. Until Tech Risk calibrates a metric, its limits come from each month’s own results: Green is at or better than the median, Amber is worse by up to the usual spread between families, Red is worse than that.</dd>
  <dt>Retired metric</dt><dd>Kept in history, excluded from scoring from the effective month; building blocks re-average over the remaining metrics.</dd>
  <dt>Sharp drop</dt><dd>A family’s TRUST fell 10 points or more.</dd>
  <dt>TCC</dt><dd>Technology Change Control, the firm’s approval route for production changes. A Non-TCC change went through another route. TE-01 measures what share of a family’s deployed changes went through TCC.</dd>
  <dt>Tier 0/1 app</dt><dd>An application in the most critical tiers (Tier 0 or 1) of the ITDR application file. Several metrics turn Red when a Tier 0/1 app is affected, whatever the overall rate.</dd>
  <dt>Tolerance threshold</dt><dd>The pair of limits for one metric: the Green tolerance is the level a result must reach to be Green, the Red limit is where Red starts, and between them is Amber.</dd>
  <dt>TRUST score</dt><dd>A family’s score out of 100: the average of its scored building blocks. Green is 80 and over, Amber 50 to 79, Red below 50.</dd>
  <dt>Usual spread between families (Amber band)</dt><dd>How far apart families normally are on a metric: the distance across the middle half of them, times 1.5 and never less than 5 points. It sets how wide Amber is.</dd>

function pfCheck(o, draft){
  const E = {}, blank = k => !String(o[k] ?? '').trim(), n = k => o[k] !== '' && o[k] != null && !isNaN(+o[k]);
  if (blank('name')) E.name = 'Enter a name for the metric.';
  const id = String(o.id || '').trim();
  const taken = id && [...D.metrics.map(m => m.id), ...PROPS.map(p => p.id)].includes(id);
  if (draft) { if (taken) E.id = 'This ID is already used by a metric or a proposal. Choose another.'; return E; }
  if (blank('block')) E.block = 'Choose the building block this metric belongs to.';
  if (blank('provider')) E.provider = 'Choose the team that will provide the data.';
  if (blank('system')) E.system = 'Name the system of record the numbers come from.';
  if (!id) E.id = 'Enter a proposed ID, for example SE-07.';
  else if (!/^[A-Z]{2}-\d{2}$/.test(id)) E.id = 'Use two capital letters, a hyphen and two digits, for example SE-07.';
  else if (taken) E.id = 'This ID is already used by a metric or a proposal. Choose another.';
  if (blank('why')) E.why = 'Say in a sentence or two why leadership needs this number.'; else if (String(o.why).length > 400) E.why = 'Shorten this to 400 characters or fewer.';
  if (blank('num')) E.num = 'Say what is counted in the numerator.';
  if (blank('den')) E.den = 'Say what the numerator is measured against.';
  if (!o.dir) E.dir = 'Choose whether a higher or a lower value is better.';
  if (!(n('minpop') && +o.minpop >= 1 && Number.isInteger(+o.minpop))) E.minpop = 'Enter the smallest population that can be scored, as a whole number of 1 or more.';
  if (!n('green')) E.green = 'Enter the Green tolerance as a number in the chosen unit.';
  if (!n('red')) E.red = 'Enter the Red limit as a number in the chosen unit.';
  if (n('green') && n('red') && o.dir && (o.dir === 'higher' ? +o.green < +o.red : +o.green > +o.red)) E.red = o.dir === 'higher' ? 'For a metric where higher is better, the Red limit must not be above the Green tolerance.' : 'For a metric where lower is better, the Red limit must not be below the Green tolerance.';
  if (blank('basis')) E.basis = 'Choose the basis for the tolerance thresholds.';
  else if (o.basis === 'Policy' && blank('policy')) E.policy = 'Name the policy that sets the tolerance threshold.';
  if (blank('limits')) E.limits = 'List at least one known limitation, even if it is minor.';
  if (blank('counters')) E.counters = 'List at least one counter-measure against gaming or error.';
  const open = PF_TESTS.filter((_, i) => !o['t' + i]).length;
  if (open) E.tests = `${open} of the six statements ${open === 1 ? 'is' : 'are'} not ticked. Tick all six, or save a draft and come back.`;

}
